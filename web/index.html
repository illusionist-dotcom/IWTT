<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#20352e">
  <meta name="description" content="IWTT — a private, local-first vault for original thoughts, ideas, experiments, inventions, and projects.">
  <title>IWTT · Thought Vault</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#capture" data-view="capture" aria-label="IWTT Thought Vault home">
        <span class="brand-mark" aria-hidden="true"><span></span><i></i></span>
        <span class="brand-copy"><strong>IWTT</strong><small>THOUGHT VAULT</small></span>
      </a>
      <button class="side-capture" data-view="capture"><span class="plus">＋</span><span>Capture a thought</span><kbd>N</kbd></button>
      <div class="nav-label">YOUR VAULT</div>
      <nav class="primary-nav">
        <button class="nav-item active" data-view="capture"><span class="nav-icon icon-spark">✳</span><span>Capture</span><span class="nav-hint">01</span></button>
        <button class="nav-item" data-view="vault"><span class="nav-icon">▤</span><span>Vault</span><span class="nav-count" id="nav-active-count">—</span></button>
        <button class="nav-item" data-view="search"><span class="nav-icon">⌕</span><span>Search</span><span class="nav-hint">⌘ K</span></button>
        <button class="nav-item" data-view="timeline"><span class="nav-icon">◷</span><span>Timeline</span></button>
        <button class="nav-item" data-view="graveyard"><span class="nav-icon">♧</span><span>Graveyard</span><span class="nav-count muted" id="nav-grave-count">—</span></button>
        <button class="nav-item" data-view="connections"><span class="nav-icon">⌘</span><span>Connections</span></button>
      </nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-note">
        <span class="local-dot"></span><span><strong>Private by design</strong><small>Stored on this device</small></span>
      </div>
      <button class="nav-item settings-link" data-view="data"><span class="nav-icon">⚙</span><span>Data & privacy</span></button>
      <div class="sidebar-version">IWTT v0.1 <span>·</span> THOUGHT VAULT</div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div class="topbar-context"><span class="crumb-dot"></span><span id="topbar-label">CAPTURE</span></div>
        <form class="global-search" id="global-search-form" role="search">
          <span class="search-glass" aria-hidden="true">⌕</span>
          <input id="global-search-input" type="search" placeholder="Find a thought from a fragment…" aria-label="Search your thought vault">
          <kbd>↵</kbd>
        </form>
        <div class="topbar-right"><span class="save-status"><i></i> LOCAL VAULT</span><button class="avatar" title="Your local vault">I</button></div>
      </header>
      <div id="app-view" class="app-view" aria-live="polite">
        <div class="loading-state"><span class="loader"></span><p>Opening your thought vault…</p></div>
      </div>
      <footer class="app-footer"><span>YOUR ORIGINAL THOUGHTS STAY YOURS</span><span>IWTT · A PRIVATE MEMORY SYSTEM</span></footer>
    </main>
  </div>
  <div id="toast-region" class="toast-region" aria-live="assertive" aria-atomic="true"></div>
  <noscript><div class="noscript">IWTT needs JavaScript enabled in your browser to use the local application.</div></noscript>
</body>
</html>
